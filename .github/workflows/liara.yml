name: Deploy to Liara

on:
  push:
    branches:
      - main

jobs:
  # ممیزی (بخش J): قبل از deploy، آزمون‌های خودکار باید موفق شوند.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "python-telegram-bot[job-queue]==21.9" requests jdatetime reportlab arabic-reshaper python-bidi

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Run mandatory test suite (token-free)
        run: python tests/run_all.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Liara CLI
        run: npm i -g @liara/cli@5

      - name: Deploy to Liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          liara deploy --app="shirazmedical" --api-token="$LIARA_TOKEN" --no-app-logs --port=8080
