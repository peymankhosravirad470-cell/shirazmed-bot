name: Collect Doctors

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python collect.py
      - name: Upload HTML debug
        uses: actions/upload-artifact@v4
        with:
          name: html-debug
          path: cache/
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/doctors/
          git commit -m "update doctors" || echo "no change"
          git pull --rebase
          git push